<script>
        function toggleSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('mobile-sidebar-hidden')) {
                sidebar.classList.remove('mobile-sidebar-hidden');
                sidebar.classList.add('mobile-sidebar-visible');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('mobile-sidebar-hidden');
                sidebar.classList.remove('mobile-sidebar-visible');
                overlay.classList.add('hidden');
            }
        }

        // Search Input focus effect
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            const pill = searchInput.closest('.sketch-pill');
            pill.classList.add('border-primary');
            pill.classList.add('ring-1');
            pill.classList.add('ring-primary/20');
        });
        searchInput.addEventListener('blur', () => {
            const pill = searchInput.closest('.sketch-pill');
            pill.classList.remove('border-primary');
            pill.classList.remove('ring-1');
            pill.classList.remove('ring-primary/20');
        });
    </script>
